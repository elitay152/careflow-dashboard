name: Website checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run test:security
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check tracked files for unreviewed secrets
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$(mktemp -d)"
          trap 'rm -rf "$tools_dir"' EXIT
          python -m venv "$tools_dir"
          "$tools_dir/bin/python" -m pip install 'pip==26.2.2'
          "$tools_dir/bin/python" -m pip install 'detect-secrets==1.5.0'
          git ls-files -z | xargs -0 "$tools_dir/bin/detect-secrets-hook" --baseline .secrets.baseline
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
