name: Website checks and Pages deployment
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Check tracked files for unreviewed secrets
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$(mktemp -d)"
          trap 'rm -rf "$tools_dir"' EXIT
          python -m venv "$tools_dir"
          "$tools_dir/bin/python" -m pip install 'pip==26.2.2'
          "$tools_dir/bin/python" -m pip install 'detect-secrets==1.5.0'
          git ls-files -z | xargs -0 "$tools_dir/bin/detect-secrets-hook" --baseline .secrets.baseline
      - name: Check out the reviewed readmission pipeline
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: elitay152/Careflow
          ref: 9bfcc9352255c88ee98b66c679ab19971fa5223f # Pinned readmission implementation
          path: .careflow-backend
          persist-credentials: false
      - name: Fetch UCI and evaluate discharge-time readmission
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          UCI_READMISSION_SHA256: ${{ vars.UCI_READMISSION_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .careflow-backend/.venv
          .careflow-backend/.venv/bin/python -m pip install 'pip==26.2.2'
          .careflow-backend/.venv/bin/python -m pip install -c .careflow-backend/security-constraints.txt -e '.careflow-backend[ml]'
          .careflow-backend/.venv/bin/python -m careflow.uci_readmission --download
          node scripts/sync-readmission.mjs .careflow-backend/data/public/readmission.json
      - run: npm run test:security
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Test the GitHub Pages repository path
        run: npm run test:pages
      - name: Recheck release artifacts
        run: node scripts/check-artifacts.mjs
      - name: Upload the validated static site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Skip a superseded main commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [[ ! "$current_main" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Could not verify the current main commit.' >&2
            exit 1
          fi
          if [[ "$current_main" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'Skipping obsolete build: main has moved.'
          fi
      - name: Check Pages configuration
        if: steps.source.outputs.current == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy the checked build
        if: steps.source.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
